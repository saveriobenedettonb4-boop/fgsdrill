    <rect x="78" y="92" width="60" height="22" rx="4"/>
    <path d="M94,114V139Q94,142 97,142H119Q122,142 122,139V114M94,122L122,118M94,129L122,125M94,136L122,132"/>
  </g>
  <path class="f a" d="M158,98V68M152,75L158,68L164,75"/>
</svg>
