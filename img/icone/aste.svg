<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Aste di perforazione: l'asta si allunga, la quota la segue -->
  <style>
    .y{stroke:#eec30d;stroke-width:3}
    .l,.r{animation:l 2.8s cubic-bezier(.65,0,.35,1) infinite alternate}
    .r{animation-name:r}
    @keyframes l{0%,14%{transform:translateX(22px)}86%,to{transform:none}}
    @keyframes r{0%,14%{transform:translateX(-22px)}86%,to{transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <!-- i due tagli seguono le linee di interruzione, che restano ferme al centro -->
  <clipPath id="a"><path d="M0,0H123.8L99.2,160H0z"/></clipPath>
  <clipPath id="b"><path d="M145.8,0H240V160H121.2z"/></clipPath>
