<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Accessori di perforazione: la testina di sollevamento sale appesa al cavo (in giallo) -->
  <style>
    .y{stroke:#eec30d;stroke-width:3}
    .f{stroke:#f3dd8a}
    .u,.a{animation:u 3.4s ease-in-out infinite}
    .a{animation-name:a}
    @keyframes u{0%,10%,to{transform:translateY(5px)}45%,65%{transform:translateY(-5px)}}
    @keyframes a{0%,8%{opacity:0;transform:translateY(8px)}30%,52%{opacity:1;transform:none}72%{opacity:0;transform:translateY(-6px)}72.01%,to{opacity:0;transform:translateY(8px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
