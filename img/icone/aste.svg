  <g clip-path="url(#a)"><path class="l" d="M150,84H58L50,78H25Q22,78 22,81V111Q22,114 25,114H50L58,108H150"/></g>
  <g clip-path="url(#b)"><g class="r">
    <path d="M90,84H182L190,78H204V114H190L182,108H90"/>
    <path d="M204,82L222,85V107L204,110M209,83L206.5,109.5M214,84L211.5,108.7M219,84.6L216.5,108"/>
  </g></g>
  <path d="M113,70L105,122M135,70L127,122"/>
</svg>
